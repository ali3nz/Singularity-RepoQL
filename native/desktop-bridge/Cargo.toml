[package]
name = "singularity-desktop-bridge"
version = "0.1.0"
edition = "2021"
description = "Windows-native, read-only MemoryCore MCP adapter for desktop coding GUIs"
license = "MIT"

# Optional Office is excluded from option 1. Build those with
# --no-default-features; option 2 use --features office.
[features]
default = []
office = []

[dependencies]
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
