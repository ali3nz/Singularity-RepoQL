[package]
name = "singularity-source-packager"
version = "0.1.0"
edition = "2021"
license = "UNLICENSED"
description = "Native Rust Windows source bundle classification, deterministic packager and ZIP acceptance scanner"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
zip = { version = "0.6.6", default-features = false, features = ["deflate"] }
walkdir = "2"

[dev-dependencies]
tempfile = "3"
