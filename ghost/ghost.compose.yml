# Ghost — persistent companion agent that dreams (optional add-on).
#
# Runs ONE service:
#   - ghost-dream:   daemon that wakes hourly for the checkpointed dream cycle
#                    (experiences -> related -> patterns -> evolution ->
#                    consolidate -> summary), committing provenance-stamped
#                    reflections into data/ghost/memory/
#
# HOW DREAM TURNS EXECUTE
#   dream.mjs speaks plain OpenAI-compatible HTTP, so in this compose it talks
#   to the product-network LLM proxy (`proxy:8096`) directly. No docker-exec
#   gateway runs in containers: the reflect-against-Ghost-agent gateway
#   (ghost/ghost-gateway.mjs) shells out to `docker exec` and therefore only
#   runs on the HOST (see ghost/systemd/ghost-gateway.service). Containers are
#   deliberately NOT given a docker CLI or socket — mounting a docker socket
#   into a container is an explicit operator action, never a default.
#
# If you run the host gateway, point the dream daemon at it instead:
#   GATEWAY_URL=http://127.0.0.1:18003/v1 requires either running this service
#   with network_mode: host or publishing the gateway on the compose network.
#
# Prerequisites:
#   - secrets/ghost.env exists (create with `ghost/setup-ghost.sh` or copy from
#     templates/product.env.example)
#   - scripts/start.sh has created the `singularity-product-net` network and
#     `data/ghost/` directory structure (host-side, including the git init for
#     dream commit provenance)
#
# Run from the repository root:
#   docker compose -f ghost/ghost.compose.yml up -d
services:
  ghost-dream:
    # Non-slim bookworm: needs git for dream commit provenance in data/ghost/memory.
    image: ${GHOST_NODE_IMAGE:-node:22-bookworm}
    container_name: singularity-ghost-dream
    working_dir: /app
    command: ["/bin/sh", "-c", "while true; do node ghost/dream.mjs --agent ghost --agent-dir /data/ghost || true; sleep \"${GHOST_DREAM_CHECK_INTERVAL_SEC:-3600}\"; done"]
    env_file:
      - ${GHOST_ENV_FILE:-../secrets/ghost.env}
    environment:
      # The lane, its key and the dream model ladder come from the env_file
      # (secrets/ghost.env — DERIVED by ghost/setup-ghost.sh, including the
      # MEMORY_LLM_MODEL-derived DREAM_MODELS). They are deliberately NOT
      # repeated here: Compose resolves ${...} interpolation from the host
      # environment / compose .env only — it never reads env_file values, so an
      # interpolated fallback would silently override the real configured lane
      # (this shipped default /claude-code/default/v1 kept a provisioned
      # openchamber-scoped key on a lane that rejects it).
      GHOST_BACKEND: "${GHOST_BACKEND:-openchamber}"
      GHOST_DATA_DIR: "/data/ghost"
      GHOST_TIMEZONE: "${GHOST_TIMEZONE:-UTC}"
      # The memfs git repository is created host-side (often uid-mapped to the
      # operator), so the container's root would hit "dubious ownership" and
      # the dream commit step could never record provenance. Container-scoped
      # safe.directory: this git config does not outlive the container.
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: "safe.directory"
      GIT_CONFIG_VALUE_0: "/data/ghost/memory"
    volumes:
      - ../ghost:/app/ghost:ro
      - ../data/ghost:/data/ghost
    networks:
      - product
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.5

networks:
  product:
    external: true
    name: ${SINGULARITY_NETWORK:-singularity-product-net}
