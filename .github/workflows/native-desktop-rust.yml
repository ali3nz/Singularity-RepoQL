      - 'adapters/claude-code/doc-hook.mjs'
      - 'adapters/claude-code/doc-hook.test.mjs'
      - 'scripts/doc-ingest-node.mjs'
      - 'scripts/doc-ingest-node.test.mjs'
      - 'scripts/memory-doc-ingest.py'
      - 'scripts/test_doc_ledger_corruption.py'
      - 'scripts/test_doc_ledger_lock.py'
