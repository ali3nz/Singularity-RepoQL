      - 'dashboard/static/app.js'
      - 'dashboard/static/app.css'
      - 'dashboard/static/index.html'
      - 'dashboard/static/kanban_native.js'
      - 'dashboard/tests/browser_kanban_stage_readback_smoke.py'
      - 'dashboard/tests/dashboard_command_center_test.mjs'
      - 'connectors/kanzo/sql/imported_tasks.sql'
      - 'connectors/kanzo/SOURCE-SHA256'
      - 'native/desktop-bridge/**'
      - 'native/windows/**'
      - 'scripts/setup-agent-profiles.mjs'
      - 'scripts/setup-agent-profiles.test.mjs'
      - 'native/windows/claude_complete_memory_profiles.mjs'
      - 'native/windows/claude_complete_memory_profiles.test.mjs'
      - 'native/windows/claude_complete_doc_parity.mjs'
      - 'native/windows/claude_complete_doc_parity.test.mjs'
      - 'scripts/doc-policy.mjs'
