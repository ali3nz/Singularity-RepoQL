# Portable dashboard service. This does NOT start RepoQL, OpenChamber, Kanzo,
# Tencent, Office or Ghost; those are separate, externally installed services.
# Read docs/DASHBOARD-SETUP.md first: container access to the host `rql` client
# is installation-specific and is not assumed here.
name: singularity-dashboard

services:
  dashboard:
    image: python:3.12-slim
    working_dir: /app
    command: ["python3", "/app/server.py", "serve"]
    restart: unless-stopped
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 256
    tmpfs:
      - /tmp:size=64m
    ports:
      - "127.0.0.1:18100:18100"
    volumes:
      - ./:/app:ro
      # Runtime state lives OUTSIDE the shipped tree.
      - dashboard-state:/var/lib/singularity-dashboard
      # Read-only view of the RepoQL workspace the dashboard reports on.
      - ${SINGULARITY_WORKSPACE:-/srv/singularity/workspace}:/workspace:ro
    environment:
      SINGULARITY_WORKSPACE: /workspace
      SINGULARITY_STATE_DIR: /var/lib/singularity-dashboard
      SINGULARITY_BIND: 0.0.0.0
      SINGULARITY_PORT: "18100"
      PYTHONDONTWRITEBYTECODE: "1"
      SINGULARITY_RQL_BIN: ${SINGULARITY_RQL_BIN:-/usr/local/bin/rql}
      SINGULARITY_ALLOW_PEERS: ${SINGULARITY_ALLOW_PEERS:-127.0.0.1/32,::1/128}
      SINGULARITY_PUBLIC_URL: ${SINGULARITY_PUBLIC_URL:-}
      SINGULARITY_ACCESS_TEAM: ${SINGULARITY_ACCESS_TEAM:-}
      SINGULARITY_ACCESS_AUD: ${SINGULARITY_ACCESS_AUD:-}
    env_file:
      - path: .env
        required: false
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:18100/', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  dashboard-state:
