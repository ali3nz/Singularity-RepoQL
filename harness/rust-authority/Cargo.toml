[package]
name = "orchestra-observer"
version = "0.6.0"
edition = "2021"
description = "Offline Rust migration components and bounded Orchestra telemetry"
license = "UNLICENSED"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
fs2 = "0.4"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"
regex = "1"
sha2 = "0.10"
